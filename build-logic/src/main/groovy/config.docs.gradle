// It is maintained in the grails-plugin-template repository.
// https://github.com/grails-plugins/grails-plugin-template/tree/main/build-logic
def docProject = provider {
    project(":${project.name - 'root'}docs")
}
def pluginProject = provider {
    project(":${project.name - '-root'}")
}

tasks.register('cleanDocs', Delete) {
    description = 'Deletes the documentation output'
    group = 'documentation'

    delete(rootProject.layout.projectDirectory.dir('build/docs'))
}

// LOCAL DIVERGENCE (see config.docs.gradle.lock): the template re-runs Groovydoc here,
// wiring in the plugin project's source and classpath. Under Gradle 9 that fails with
// "Resolution of the configuration ':<plugin>:detachedConfigurationN' was attempted without
// an exclusive lock", because a task in the root project may no longer resolve a
// configuration owned by another project. Since the plugin project already produces exactly
// this Groovydoc, copy its output instead of recomputing it - no cross-project resolution,
// same result. Groovydoc options (access level, excludes) now live in plugin/build.gradle.
tasks.register('aggregateGroovyApiDoc', Copy) {
    description = 'Collects the Groovy API Documentation for the plugin project under build/docs/gapi'
    group = 'documentation'

    def upstream = pluginProject.flatMap {
        it.tasks.named('groovydoc', Groovydoc)
    } as Provider<Groovydoc>

    dependsOn(tasks.named('cleanDocs'))
    dependsOn(upstream)

    from(upstream.map { it.destinationDir })
    into(rootProject.layout.buildDirectory.dir('docs/gapi'))
}

tasks.register('docs') {
    description = 'Generates the documentation'
    group = 'documentation'

    dependsOn(
            'aggregateGroovyApiDoc',
            docProject.get().tasks.named('asciidoctor')
    )
    finalizedBy(
            'copyAsciiDoctorDocs'
    )
}

tasks.register('copyAsciiDoctorDocs', Copy) {
    group = 'documentation'

    from(docProject.flatMap { it.layout.buildDirectory })
    into(rootProject.layout.buildDirectory)
    include('docs/**')
    includeEmptyDirs = false

}
